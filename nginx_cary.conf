# ==============================================================================
# CARY Flutter Web - Nginx Production Server Configuration
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cary-app.com www.cary-app.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cary-app.com www.cary-app.com;

    root /var/www/cary_web/build/web;
    index index.html;

    # SSL configuration (add your certs here)
    # ssl_certificate /etc/letsencrypt/live/cary-app.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cary-app.com/privkey.pem;

    # Compression: Enable gzip and brotli static files
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    brotli on;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # 1. HTML Entry Points & Bootstrapping: Never cache stale version
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /version.json {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 2. Immutable WebAssembly & CanvasKit (1 Year Cache)
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Modern WebP and AVIF Images & Fonts (1 Year Cache)
    location ~* \.(webp|avif|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. Standard Images and Icons (1 Month with revalidation)
    location ~* \.(png|jpg|jpeg|ico|gif|svg)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    # 5. Compiled JS Code Chunks & Source Maps
    location ~* \.part\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.js\.map$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /main.dart.js {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # 6. Deep Links & Well-Known Endpoints
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
    }

    # 7. Flutter SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
