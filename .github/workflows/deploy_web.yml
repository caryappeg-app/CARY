name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          cat << 'EOF' > env.json
          {
            "USE_MOCK_DATA": "false",
            "API_BASE_URL": "https://qjlwtitcwsqnhcfrxdcv.supabase.co",
            "OTP_LENGTH": "8",
            "API_KEY": "sb_publishable_5LROCXppE2KzzBEztpYYew_ZeJvueOs",
            "SUPPORT_WHATSAPP": "01201082852",
            "SHARE_LINK_BASE": "https://cary.cary-egcom.workers.dev",
            "ADS_WORKER_URL": "https://cary-ads-api.cary-app-eg.workers.dev"
          }
          EOF
          flutter build web --release --dart-define-from-file=env.json --base-href "/${{ github.event.repository.name }}/"
          cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
