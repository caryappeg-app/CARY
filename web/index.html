    (function () {
      if (typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function') {

          var opt = options || {};
          var type = opt.type === 'character' ? 'grapheme' : (opt.type === 'sentence' ? 'sentence' : 'word');
          var segmenter = new Intl.Segmenter(locales, { granularity: type });
          var text = '';
          var segments = [];
          var cur = 0;
          return {
            adoptText: function (str) {
              text = String(str == null ? '' : str);
              segments = Array.from(segmenter.segment(text)).map(function (s) { return s.index; });
              segments.push(text.length);
              cur = 0;
            },
            first: function () { cur = 0; return segments[0] || 0; },
            next: function () {
              cur++;
              return cur < segments.length ? segments[cur] : -1;
            },
            current: function () {
              return cur < segments.length ? segments[cur] : -1;

            breakType: function () { return 'word'; }
          };
        };

    })();
