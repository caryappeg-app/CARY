name: cary_app
description: CARY - سوق الشفافية والثقة لسيارات صعيد مصر
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  image_picker: ^1.1.2
  flutter_native_splash: ^2.4.8
  dio: ^5.11.1
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.2
  share_plus: ^13.3.1
  app_links: ^7.2.2
  cached_network_image: ^4.0.3
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/car_brands.json
    - assets/images/

# إعدادات السبلاش (موحدة للون الأبيض دائماً ولن تتأثر بوضع الداكن)
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/cary_logo.png

  android_12:
    color: "#FFFFFF"
    image: assets/images/cary_logo.png

  android: true
  ios: true
  fullscreen: true

# إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/splash.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/splash.png"